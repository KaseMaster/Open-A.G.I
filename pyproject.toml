[build-system]
requires = ["setuptools>=82.0.1", "wheel", "setuptools_scm[toml]>=9.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-framework"
version = "3.1.3"
description = "AEGIS Framework - Sistema de IA Distribuida y Seguridad Avanzada"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jose Gómez", email = "kasemaster@aegis-framework.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=46.0.7",
    "pycryptodome>=3.23.0",
    "pyotp>=2.9.0",
    "stem>=1.8.2",
    "pysocks>=1.7.1",
    "aiohttp>=3.13.5",
    "aiohttp-socks>=0.11.0",
    "asyncio-mqtt>=0.16.2",
    "websockets>=15.0.1",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "scikit-learn>=1.6.1",
    "torch>=2.8.0",
    "transformers>=4.57.6",
    "aiosqlite>=0.22.1",
    "redis>=7.0.1",
    "loguru>=0.7.3",
    "prometheus-client>=0.25.0",
    "psutil>=7.2.2",
    "pandas>=2.3.3",
    "flask>=3.1.3",
    "zeroconf>=0.148.0",
    "Flask-SocketIO>=5.6.1",
    "netifaces>=0.11.0",
    "pydantic>=2.12.5",
    "click>=8.1.8",
    "rich>=14.3.4",
    "tqdm>=4.67.3",
    "python-dotenv>=1.2.1",
    "plotly>=6.7.0",
]

[project.optional-dependencies]
gpu = [
    "torch[cu118]>=2.8.0",
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "black>=25.11.0",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
]

[project.scripts]
aegis = "main:cli"

[project.urls]
Homepage = "https://github.com/KaseMaster/Open-A.G.I"
Repository = "https://github.com/KaseMaster/Open-A.G.I"
Issues = "https://github.com/KaseMaster/Open-A.G.I/issues"
Documentation = "https://github.com/KaseMaster/Open-A.G.I/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.conf", "*.torrc"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "stem.*",
    "pysocks.*",
    "asyncio_mqtt.*",
    "aiohttp_socks.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == ['\"]__main__['\"]:",
    "class .*Protocol\\):",
    "@abstractmethod",
]
